# S29 (`design/30-slices.md` § S29): every gate this repository already has
# runs unattended on every push and pull request, rather than when someone
# remembers to run it. `node-version-file: package.json` pins the runner to
# `engines.node`; `.npmrc`'s `engine-strict=true` makes `npm ci` itself
# refuse a Node outside that range, so a mismatch fails the job rather than
# silently running every gate on a different runtime.
#
# `npm run build` chains typecheck, the registry build and every `check:*`
# gate (`check:layering`, `check:migration`, `check:layer-direction`) — the
# same chain the Dockerfile's `builder` stage runs, so this is the one place
# that ordering is stated. Out of scope: running the gates for the derived
# consumer image (S20), and any deployment step — this is the repository's
# own CI, not the service's execution mechanism.

name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Build S28's container image
        run: docker build --build-arg GIT_COMMIT_SHA=${{ github.sha }} -t subzerodev-git:ci .
