# S29 (`design/30-slices.md` § S29): every gate this repository already has
# runs unattended on every push and pull request, rather than when someone
# remembers to run it. The jobs are the shared library's reusable workflows
# (The-Running-Dev/GitHub-ActionTemplates); the steps they run are no longer
# written out here.
#
# `tests` runs `npm test`, then `npm run build` (typecheck, the registry
# build and every `check:*` gate `package.json` names, the same chain the
# Dockerfile's `builder` stage runs, so `package.json` is the one place that
# ordering is stated), then S18.13's end-to-end browser suite. Node 22 is the
# runtime both images ship; `.npmrc`'s `engine-strict=true` still makes
# `npm ci` refuse a Node outside `engines.node`. `browser: true` gives the
# suite the runner's own Chrome (read by `playwright.config.ts`) instead of
# `npx playwright install --with-deps`, whose apt step could stall the job.
#
# `image` and `example-consumer` build S28's base image and S35's derived
# example-consumer image, boot each one and require `GET /healthz` to answer
# 200 within the timeout (S35.7: a tampered or mismatched registry/console
# artifact fails boot). `push: false`: this is the repository's own CI, not
# the service's execution mechanism, so nothing is published. The
# permissions are the ones GitHub checks for the reusable workflow's publish
# job before the run starts, even though that job never runs here.
#
# `push` is restricted to `main` (issue #122): a branch with an open pull
# request already gets every commit gated by `pull_request` below, so a
# `push:` with no branch filter fired a second, concurrent run of the exact
# same commit. Every commit that can reach `main` is still gated either way:
# a feature-branch commit through `pull_request`, a direct or merged push to
# `main` through `push`.
#
# `paths-ignore` skips this workflow entirely when every changed file is one
# of the design/tracking documents below — none of them is a build input.
# `design/20-contract.md` is deliberately absent from this list: it is the one
# design document actually read by the build, at
# `scripts/check-migration-matches-contract.ts` (`check:migration`) and
# `scripts/check-contract-registry-tables.ts` (`check:registry-tables`), both
# chained into `npm run build` — a change there must still run every gate.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'design/00-brief.md'
      - 'design/10-design.md'
      - 'design/30-slices.md'
      - 'design/90-decisions.md'
  pull_request:
    paths-ignore:
      - 'design/00-brief.md'
      - 'design/10-design.md'
      - 'design/30-slices.md'
      - 'design/90-decisions.md'

permissions: {}

jobs:
  tests:
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/node-ci.yml@v1
    permissions:
      contents: read
    with:
      node-versions: '["22"]'
      scripts: test build test:e2e
      browser: true
      cache: npm
      timeout-minutes: 45

  image:
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/container.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      build-args: GIT_COMMIT_SHA=${{ github.sha }}
      push: false
      smoke-port: '8080'
      smoke-path: /healthz
      smoke-env: PUBLIC_ORIGIN=http://localhost:8080

  example-consumer:
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/container.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      dockerfile: example-consumer/Dockerfile
      image-name: subzerodev-git-example-consumer
      build-args: GIT_COMMIT_SHA=${{ github.sha }}
      push: false
      smoke-port: '8080'
      smoke-path: /healthz
      smoke-env: PUBLIC_ORIGIN=http://localhost:8080
